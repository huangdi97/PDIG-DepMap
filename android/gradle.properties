# Gradle / AGP 配置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 在 Windows 上拒绝非 ASCII 工程路径（http://b.android.com/95744）。
# 本仓库路径含中文（<repo>），这是唯一绕行方式；官方明确支持该开关。
#
# 与之配套的两项 ASCII 适配（构建输出重定向 + java.io.tmpdir 重定向，
# 以及所依据的两个实测缺陷）见 settings.gradle.kts 顶部注释。
android.overridePathCheck=true

# API36 (Android 16) 基线：AGP 8.5.2 官方测试上限为 compileSdk 34，
# 升级到 36 会产生一条可抑制的警告。已按官方机制显式声明，编译产物
# 与 lint/manifest 均以 android-36.1 platform 为准（见 ANDROID_PLATFORM_BASELINE.md）。
android.suppressUnsupportedCompileSdk=36
