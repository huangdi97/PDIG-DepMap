# DepMap Android core — Gradle 配置
#
# 本文件为 Android 工程首次真实构建所必需（此前工程从未被编译过）：
# 依赖树含 AndroidX（androidx.core / biometric / fragment / sqlite），
# 未启用 android.useAndroidX 时 AGP 会直接拒绝构建。

# AndroidX（必需）
android.useAndroidX=true
android.enableJetifier=false

# 非 ASCII 工程路径豁免
# 本仓库默认检出路径含非 ASCII 字符（Windows 上常见），AGP 默认直接报错。
# 该检查是 Windows 路径编码的保守护栏；本模块为纯 Kotlin/Java 库，
# 不含 NDK 与自定义 aapt2 资源管线，故显式豁免。
android.overridePathCheck=true

# 构建 JVM
# 注意：**不要**在此加 `-Dfile.encoding=UTF-8`。
# 工程位于非 ASCII 路径（<repo>\...）。Gradle 在 classpath 过长时会写
# java argfile 并把 classpath 条目写入其中；daemon 侧写文件用的编码必须与 fork
# 出的测试 JVM 读文件用的编码（Windows 中文环境为 sun.jnu.encoding=GBK）一致，
# 否则中文路径被 mojibake，测试 worker 报
# `java.lang.ClassNotFoundException: ...DepmapContainerV1GoldenTest`。
# 实测：daemon 强制 UTF-8 时必失败；使用系统默认编码时通过。
org.gradle.jvmargs=-Xmx2048m

# 依赖解析与构建缓存
org.gradle.caching=true
org.gradle.parallel=true
