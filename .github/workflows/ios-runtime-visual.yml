name: iOS Runtime Visual

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test/multiclient-runtime-visual-sweep
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-runtime-visual.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ios-runtime-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ios-runtime-visual:
    name: iOS fresh canonical + XCUITest closure (iPhone+iPad, xcresult)
    # 同上（2026-11-13 探针）：`macos-14` 退役才导致 "configuration not supported"，
    # arm64 本身可用；`macos-15`(arm64) 上模拟器 83s 启动，故用它跑 XCUITest。
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # pull_request defaults to refs/pull/<n>/merge. Runtime / platform
          # evidence must instead prove the exact feature-branch source HEAD.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Swift toolchain
        run: swift --version

      - name: Xcode / simulator inventory (dynamic, never hardcoded)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available || true

      - name: Build (PDIGCore + PDIGConformance + PDIGArgon2 + PDIGApp)
        working-directory: ios
        run: |
          set -o pipefail
          mkdir -p ../artifacts/runtime-evidence/2026-09-27-closure-ios
          swift build 2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/ios-swift-build.log | tail -n 3

      - name: Test (fresh canonical 91+37 + core smoke + PDIGApp view models)
        working-directory: ios
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/ios-swift-test.log | tail -n 3

      - name: Install xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project (app PDIGApp + XCUITest bundle PDIGAppUITests)
        working-directory: ios
        run: xcodegen generate

      # IOS_APP_TARGET: generic simulator app build (evidence + source for the
      # manual-launch diagnostic below).
      - name: Build app for iOS Simulator (IOS_APP_TARGET)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project PDIG.xcodeproj \
            -scheme PDIGApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived/closure \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/ios-app-build.log | tail -n 5

      - name: Select and boot iPhone + iPad simulators
        # 托管 Intel VM 上 `simctl boot` 会 wedge（实测 >17 分钟无进展），给这一步封顶，
        # 免得每次 push 白烧 90 分钟的 macOS 分钟数；失败原因仍会如实以 exit 124 记录。
        timeout-minutes: 25
        run: |
          set -e
          # runtime 版本**动态取自本机可用 runtime**（新→旧），不再写死 iOS 17.x：
          # GitHub 的 `macos-15-intel` 只带 iOS 18.x，写死 17.5/17.4/17.2/17.0
          # 会一个都选不到（实测 `picked iPhone: ? () ; iPad: ? ()` → exit 1）。
          # 机型仍优先 430pt 宽的 iPhone（Pro Max / Plus），避免右侧底栏在 420pt
          # 根视图最小宽度下被裁切。
          runtimes=$(xcrun simctl list runtimes | awk '/^iOS / && $0 !~ /unavailable/ {print $2}' | sort -rV | tr '\n' ' ')
          echo "available iOS runtimes: $runtimes"
          devlist=$(xcrun simctl list devices available)
          pick_device() {
            local model="$1"
            shift
            local line udid
            for os in "$@"; do
              line=$(printf '%s\n' "$devlist" | awk -v os="$os" -v m="$model" '
                $0 == "-- iOS " os " --" { inblock=1; next }
                inblock && $0 ~ /^--/ { inblock=0 }
                inblock && index($0, m " (") > 0 { print; exit }
              ')
              if [ -n "$line" ]; then
                udid=$(printf '%s\n' "$line" | grep -oE '[0-9A-F-]{36}' | head -n 1)
                echo "$udid"
                return 0
              fi
            done
            return 1
          }
          iphone=$(pick_device "iPhone 15 Pro Max" $runtimes || true)
          if [ -z "$iphone" ]; then
            iphone=$(pick_device "iPhone 16 Pro Max" $runtimes || true)
          fi
          if [ -z "$iphone" ]; then
            iphone=$(pick_device "iPhone 15 Plus" $runtimes || true)
          fi
          if [ -z "$iphone" ]; then
            iphone=$(pick_device "iPhone 14 Pro Max" $runtimes || true)
          fi
          if [ -z "$iphone" ]; then
            iphone=$(pick_device "iPhone" $runtimes || true)
          fi
          ipad=$(pick_device "iPad Pro 11-inch (M4)" $runtimes || true)
          if [ -z "$ipad" ]; then
            ipad=$(pick_device "iPad Pro (11-inch) (4th generation)" $runtimes || true)
          fi
          if [ -z "$ipad" ]; then
            ipad=$(pick_device "iPad" $runtimes || true)
          fi
          iphonename="?"
          ipadname="?"
          if [ -n "$iphone" ]; then
            iphonename=$(xcrun simctl list devices available | grep "$iphone" | sed -E 's/^[[:space:]]*(.*) \([0-9A-F-]{36}\).*/\1/' | head -n 1)
          fi
          if [ -n "$ipad" ]; then
            ipadname=$(xcrun simctl list devices available | grep "$ipad" | sed -E 's/^[[:space:]]*(.*) \([0-9A-F-]{36}\).*/\1/' | head -n 1)
          fi
          echo "IPHONE_UDID=$iphone" >> "$GITHUB_ENV"
          echo "IPAD_UDID=$ipad" >> "$GITHUB_ENV"
          echo "IPHONE_NAME=$iphonename" >> "$GITHUB_ENV"
          echo "IPAD_NAME=$ipadname" >> "$GITHUB_ENV"
          echo "picked iPhone: $iphonename ($iphone) ; iPad: $ipadname ($ipad)"
          mkdir -p conformance/reports

          wait_boot() {
            local udid="$1"
            local label="$2"
            python3 - "$udid" "$label" <<'PY'
          import subprocess, sys
          udid, label = sys.argv[1], sys.argv[2]
          try:
              r = subprocess.run(
                  ["xcrun", "simctl", "bootstatus", udid, "-b"],
                  # 托管 Intel macOS 上首次启动模拟器很慢（实测 iPad 超过 180s），
                  # 超时放宽到 420s 并让两台并行启动。
                  timeout=420,
                  text=True,
              )
          except subprocess.TimeoutExpired:
              print(f"SIMULATOR_BOOT_TIMEOUT:{label}:{udid}", file=sys.stderr)
              raise SystemExit(124)
          if r.returncode != 0:
              print(f"SIMULATOR_BOOT_FAILED:{label}:{udid}:rc={r.returncode}", file=sys.stderr)
              raise SystemExit(r.returncode)
          PY
          }

          if [ -z "$iphone" ] || [ -z "$ipad" ]; then
            echo "SIMULATOR_BOOT=NO_REQUIRED_DEVICE:iphone=$iphone:ipad=$ipad"               > conformance/reports/ios-simulator-boot.txt
            exit 1
          fi

          # 串行启动：在 3 核托管 Intel VM 上并发 boot 会把 CoreSimulator 拖住
          # （实测并发那轮卡在 `simctl boot` >40 分钟，只能取消）；bootstatus 预算 420s。
          xcrun simctl shutdown "$iphone" 2>/dev/null || true
          xcrun simctl boot "$iphone"
          wait_boot "$iphone" "iphone"
          xcrun simctl shutdown "$ipad" 2>/dev/null || true
          xcrun simctl boot "$ipad"
          wait_boot "$ipad" "ipad"

          echo "SIMULATOR_BOOT=PASS:iphone=$iphone:ipad=$ipad"             > conformance/reports/ios-simulator-boot.txt
          xcrun simctl list devices | grep -E "Booted" || true

      # Diagnostic: manually launch PDIGApp on the booted iPhone simulator in
      # --uitest-demo mode, so an app-launch crash (or a healthy launch) is
      # captured with crash logs + screenshot + console log instead of the
      # opaque "test runner killed" error. Step never fails.
      - name: Diagnostic - manual app launch (uitest-demo) on iPhone simulator
        working-directory: ios
        run: |
          set +e
          APP=derived/closure/Build/Products/Debug-iphonesimulator/PDIGApp.app
          xcrun simctl bootstatus "$IPHONE_UDID" -b >/dev/null 2>&1
          xcrun simctl install "$IPHONE_UDID" "$APP"
          xcrun simctl launch "$IPHONE_UDID" com.pdig.depmap.app --uitest-demo
          sleep 25
          echo "--- ps check ---"
          xcrun simctl spawn "$IPHONE_UDID" /bin/ps -ax | grep -i pdig || true
          if xcrun simctl spawn "$IPHONE_UDID" /bin/ps -ax | grep -q "PDIGApp"; then
            echo "APP_LAUNCH_CHECK=ALIVE"
          else
            echo "APP_LAUNCH_CHECK=DEAD"
          fi
          mkdir -p ../artifacts/runtime-evidence/2026-09-27-closure-ios/crashlogs
          cp ~/Library/Logs/DiagnosticReports/*.ips ../artifacts/runtime-evidence/2026-09-27-closure-ios/crashlogs/ 2>/dev/null
          xcrun simctl spawn "$IPHONE_UDID" log show --last 4m --predicate 'process == "PDIGApp"' --style compact > ../artifacts/runtime-evidence/2026-09-27-closure-ios/ios-app-launch-console.log 2>&1
          xcrun simctl io "$IPHONE_UDID" screenshot ../artifacts/runtime-evidence/2026-09-27-closure-ios/ios-manual-launch-iphone.png >/dev/null 2>&1
          xcrun simctl terminate "$IPHONE_UDID" com.pdig.depmap.app >/dev/null 2>&1
          exit 0

      # Each test leg runs in its OWN DerivedData dir with the proven-good
      # recipe: (1) plain `xcodebuild build` pre-places PDIGApp.app, (2)
      # build-for-testing generates the scheme xctestrun, (3) test-without-
      # building consumes it. Sharing one DerivedData dir between the two legs
      # is NOT safe: the second build-for-testing overwrites the single
      # Build/Products/PDIGApp_iphonesimulator17.5-arm64.xctestrun with one
      # whose app path is broken ("The bundle identifier for PDIGApp couldn't
      # be read .../PDIGApp" - missing .app suffix), failing the second leg.
      - name: XCUITest on iPhone simulator (xcresult)
        working-directory: ios
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$IPHONE_UDID" -b
          rm -rf derived/closure-iphone
          xcodebuild build \
            -project PDIG.xcodeproj \
            -scheme PDIGApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived/closure-iphone \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/build-iphone.log | tail -n 3
          xcodebuild build-for-testing \
            -project PDIG.xcodeproj \
            -scheme PDIGApp \
            -destination "platform=iOS Simulator,id=${IPHONE_UDID}" \
            -derivedDataPath derived/closure-iphone \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/build-for-testing-iphone.log | tail -n 3
          { echo "--- xctestrun in derived/closure-iphone ---"; find derived/closure-iphone -name "*.xctestrun" -exec ls -la {} \; 2>/dev/null || true; } | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/xctestrun-iphone-dump.txt
          # Workaround for Xcode 15 "The bundle identifier for PDIGApp couldn't be
          # read .../PDIGApp": the generated xctestrun may record the app path
          # WITHOUT the .app suffix. Patch it (plist -> xml -> append .app).
          for x in derived/closure-iphone/Build/Products/*.xctestrun; do
            [ -f "$x" ] || continue
            plutil -convert xml1 "$x" >/dev/null 2>&1 || true
            perl -pi -e 's{/PDIGApp(</string>)}{/PDIGApp.app$1}g' "$x" 2>/dev/null || true
          done
          XCTESTRUN=$(find derived/closure-iphone -name "*.xctestrun" | head -n 1)
          echo "xctestrun for iphone leg: $XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${IPHONE_UDID}" \
            -resultBundlePath ../artifacts/runtime-evidence/2026-09-27-closure-ios/ios-xcresult-iphone.xcresult \
            -only-testing:PDIGAppUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/xcuitest-iphone.log | tail -n 200

      # xcodebuild 的失败细节只落在 xcresult 里，而整个 evidence artifact 有 200MB+，
      # 取回成本高。这里无论成败都把测试摘要打进日志，便于直接定位失败用例。
      - name: XCUITest summary (iPhone, always)
        if: always()
        working-directory: ios
        run: |
          set +e
          R=../artifacts/runtime-evidence/2026-09-27-closure-ios/ios-xcresult-iphone.xcresult
          echo "XCRESULT=$R"
          if [ ! -d "$R" ]; then echo "NO_XCRESULT"; exit 0; fi
          echo "--- test-results summary (counts + failureText) ---"
          xcrun xcresulttool get test-results summary --path "$R" --compact 2>/dev/null > /tmp/summary.json || true
          python3 - <<'PY' || true
          import json
          d = json.load(open('/tmp/summary.json'))
          print("result=%s passed=%s failed=%s skipped=%s" % (
              d.get("result"), d.get("passedTests"), d.get("failedTests"), d.get("skippedTests")))
          for f in d.get("testFailures") or []:
              print("FAIL %s :: %s" % (f.get("testIdentifierString"), f.get("failureText")))
          PY
          echo "--- every failing node (complete, no truncation) ---"
          xcrun xcresulttool get test-results tests --path "$R" --compact 2>/dev/null > /tmp/tests.json || true
          python3 - <<'PY' || true
          import json
          try:
              data = json.load(open('/tmp/tests.json'))
          except Exception as exc:
              print("TESTS_JSON_UNAVAILABLE %s" % exc)
              raise SystemExit(0)
          seen = set()
          def walk(node):
              if isinstance(node, dict):
                  if str(node.get("result", "")).lower() == "failed":
                      key = node.get("nodeIdentifier") or node.get("name") or "?"
                      if key not in seen:
                          seen.add(key)
                          print("FAILED_NODE %s" % key)
                  for value in node.values():
                      walk(value)
              elif isinstance(node, list):
                  for value in node:
                      walk(value)
          walk(data)
          print("failing_nodes=%d" % len(seen))
          PY
          echo "--- tail of xcuitest-iphone.log ---"
          tail -n 40 ../artifacts/runtime-evidence/2026-09-27-closure-ios/xcuitest-iphone.log 2>/dev/null
      - name: XCUITest on iPad simulator (xcresult)
        working-directory: ios
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$IPAD_UDID" -b
          rm -rf derived/closure-ipad
          xcodebuild build \
            -project PDIG.xcodeproj \
            -scheme PDIGApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath derived/closure-ipad \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/build-ipad.log | tail -n 3
          xcodebuild build-for-testing \
            -project PDIG.xcodeproj \
            -scheme PDIGApp \
            -destination "platform=iOS Simulator,id=${IPAD_UDID}" \
            -derivedDataPath derived/closure-ipad \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/build-for-testing-ipad.log | tail -n 3
          { echo "--- xctestrun in derived/closure-ipad ---"; find derived/closure-ipad -name "*.xctestrun" -exec ls -la {} \; 2>/dev/null || true; } | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/xctestrun-ipad-dump.txt
          # Workaround for Xcode 15 "The bundle identifier for PDIGApp couldn't be
          # read .../PDIGApp": the generated xctestrun may record the app path
          # WITHOUT the .app suffix. Patch it (plist -> xml -> append .app).
          for x in derived/closure-ipad/Build/Products/*.xctestrun; do
            [ -f "$x" ] || continue
            plutil -convert xml1 "$x" >/dev/null 2>&1 || true
            perl -pi -e 's{/PDIGApp(</string>)}{/PDIGApp.app$1}g' "$x" 2>/dev/null || true
          done
          XCTESTRUN=$(find derived/closure-ipad -name "*.xctestrun" | head -n 1)
          echo "xctestrun for ipad leg: $XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${IPAD_UDID}" \
            -resultBundlePath ../artifacts/runtime-evidence/2026-09-27-closure-ios/ios-xcresult-ipad.xcresult \
            -only-testing:PDIGAppUITests \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ../artifacts/runtime-evidence/2026-09-27-closure-ios/xcuitest-ipad.log | tail -n 8

      - name: N4 app-target audit + screenshots
        run: |
          mkdir -p conformance/reports artifacts/runtime-evidence
          if find ios/Sources -name "*.swift" -print0 | xargs -0 grep -l "@main" >/dev/null 2>&1; then
            echo '{"app_target": true, "app_ui_screens": 10, "xcuitest": "RUN (ios-runtime-visual closure steps)", "screenshots": "MACOS_RENDER + XCUITest xcresult attachments"}' > conformance/reports/ios-app-audit.json
          else
            echo '{"app_target": false, "n4_gap": "IOS_N4_APP_NOT_IMPLEMENTED"}' > conformance/reports/ios-app-audit.json
          fi
          cat conformance/reports/ios-app-audit.json
          # macOS 渲染截图（harness 在 PDIGApp 内，swift test 阶段已编译）
          RUNID=$(date +%Y%m%d%H%M%S)
          (cd ios && swift run PDIGApp --screenshot --runid "$RUNID" --output "../artifacts/runtime-evidence/2026-09-27-closure-ios/harness-macos")

      - name: Collect IOS_* evidence summary
        if: always()
        run: |
          set -e
          python3 tools/ios-closure/write_summary.py \
            artifacts/runtime-evidence/2026-09-27-closure-ios \
            "${GITHUB_RUN_ID}" "${SOURCE_SHA}" "${IPHONE_NAME:-?}" "${IPAD_NAME:-?}" "ios-runtime-visual.yml"
          cat artifacts/runtime-evidence/2026-09-27-closure-ios/ios-closure-summary.md

      - name: Upload iOS evidence (xcresult + logs + summary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-visual-evidence
          path: |
            conformance/reports/**
            artifacts/runtime-evidence/2026-09-27-closure-ios/**
            ios/.build/debug/**/*.json
          if-no-files-found: warn