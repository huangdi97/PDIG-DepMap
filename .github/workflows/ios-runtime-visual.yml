name: iOS Runtime Visual

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - test/multiclient-runtime-visual-sweep

permissions:
  contents: read

jobs:
  ios-runtime-visual:
    name: iOS fresh canonical + simulator inventory + N4 gap audit
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Swift toolchain
        run: swift --version

      - name: Xcode / simulator inventory (dynamic, never hardcoded)
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available || true
          xcrun simctl list devices available || true

      - name: Build (PDIGCore + PDIGConformance + PDIGArgon2)
        working-directory: ios
        run: swift build

      - name: Test (fresh canonical 91 + core smoke)
        working-directory: ios
        run: swift test

      - name: Boot an available iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "iPhone" | head -n 1 | grep -oE "[0-9A-F-]{36}" || true)
          if [ -n "$UDID" ]; then
            xcrun simctl boot "$UDID" || true
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl list devices | grep Booted || true
            echo "SIMULATOR_BOOT=PASS" > conformance/reports/ios-simulator-boot.txt
          else
            echo "SIMULATOR_BOOT=NO_DEVICE" > conformance/reports/ios-simulator-boot.txt
          fi

      - name: N4 app-target gap audit (real project scan, no fake PASS)
        run: |
          mkdir -p conformance/reports
          if find ios/Sources -name "*.swift" -print0 | xargs -0 grep -l "@main" >/dev/null 2>&1; then
            echo '{"app_target": true}' > conformance/reports/ios-app-audit.json
          else
            echo '{"app_target": false, "n4_gap": "IOS_N4_APP_NOT_IMPLEMENTED", "app_ui_screens": 0, "xcuitest": "NOT_IMPLEMENTED", "screenshots": "NOT_IMPLEMENTED"}' > conformance/reports/ios-app-audit.json
          fi
          cat conformance/reports/ios-app-audit.json

      - name: Upload iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-runtime-visual-evidence
          path: |
            conformance/reports/**
            ios/.build/debug/**/*.json
          if-no-files-found: warn