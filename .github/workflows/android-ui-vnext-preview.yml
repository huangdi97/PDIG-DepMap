name: Android UI vNext Preview APK

on:
  push:
    branches:
      - feat/android-ui-vnext-translation
    paths:
      - "android/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ui-vnext-preview
  cancel-in-progress: true

jobs:
  build-publish:
    name: Build and publish installable preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/gradle/wrapper/gradle-wrapper.properties
            android/**/*.gradle.kts

      - name: Configure Android SDK
        working-directory: android
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "sourceHead=$GITHUB_SHA"
          echo "androidHome=$ANDROID_HOME"

      - name: Core + conformance + app unit gates
        working-directory: android
        run: |
          ./gradlew --no-daemon --console=plain \
            :core:test \
            :conformance:run \
            :app:testProductionDebugUnitTest \
            :app:testPreviewDebugUnitTest

      - name: Build installable APKs
        working-directory: android
        run: |
          ./gradlew --no-daemon --console=plain \
            :app:assembleProductionDebug \
            :app:assemblePreviewDebug

      - name: Package preview distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          PROD_APK="android/app/build/outputs/apk/production/debug/app-production-debug.apk"
          PREVIEW_APK="android/app/build/outputs/apk/preview/debug/app-preview-debug.apk"

          test -f "$PROD_APK"
          test -f "$PREVIEW_APK"

          cp "$PREVIEW_APK" dist/PDIG-Android-UI-vNext-Preview.apk
          cp "$PROD_APK" dist/PDIG-Android-UI-vNext-ProductionDebug.apk

          (
            cd dist
            sha256sum \
              PDIG-Android-UI-vNext-Preview.apk \
              PDIG-Android-UI-vNext-ProductionDebug.apk \
              > SHA256SUMS.txt
          )

          SHORT_SHA="${GITHUB_SHA:0:7}"

          cat > dist/RELEASE_NOTES.md <<EOF
          # PDIG Android UI vNext Preview

          This is an installable preview build of the accepted Android Light-first UI vNext.

          - branch: feat/android-ui-vnext-translation
          - build source: $GITHUB_SHA
          - final pixel-changing Android UI source: a3b3a05580c0cd2ed451e554ba7db3edfd523cc0
          - Android visual reference: ACCEPTED
          - minSdk: 26
          - targetSdk: 36

          Recommended for direct phone evaluation:
          PDIG-Android-UI-vNext-Preview.apk

          It uses application id com.pdig.app.preview and can coexist with the production application.
          Normal launcher open starts the accepted UI vNext with SYNTHETIC REFERENCE DATA.
          This preview is for visual/touch evaluation and is NOT connected to personal production data.

          PDIG-Android-UI-vNext-ProductionDebug.apk uses com.pdig.app and is provided only to match the
          production-debug flavor used by the final Android runtime evidence. If another PDIG build with a
          different signing key is already installed, Android may reject an in-place update; uninstall the old
          package first or use the Preview APK instead.

          This is a debug-signed evaluation build, not a Play Store production-signed release.

          SHA-256 hashes are included in SHA256SUMS.txt.
          EOF

          cat > dist/BUILD_PROVENANCE.txt <<EOF
          repository=$GITHUB_REPOSITORY
          branch=feat/android-ui-vnext-translation
          sourceHead=$GITHUB_SHA
          shortHead=$SHORT_SHA
          workflowRun=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          finalPixelChangingAndroidSource=a3b3a05580c0cd2ed451e554ba7db3edfd523cc0
          androidVisualReference=ACCEPTED
          buildType=debug
          previewApplicationId=com.pdig.app.preview
          productionApplicationId=com.pdig.app
          EOF

          SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          PREVIEW_BYTES="$(stat -c %s "$PREVIEW_APK")"
          PREVIEW_SHA256="$(sha256sum "$PREVIEW_APK" | cut -d ' ' -f 1)"
          cat > dist/BUILD_PROVENANCE.json <<EOF
          {
            "repository": "$GITHUB_REPOSITORY",
            "branch": "feat/android-ui-vnext-translation",
            "sourceHead": "$GITHUB_SHA",
            "sourceTree": "$SOURCE_TREE",
            "buildVariant": "previewDebug",
            "applicationId": "com.pdig.app.preview",
            "versionName": "0.3.1",
            "versionCode": 200005,
            "minSdk": 26,
            "targetSdk": 36,
            "compileSdk": 36,
            "apkFile": "PDIG-Android-UI-vNext-Preview.apk",
            "apkBytes": $PREVIEW_BYTES,
            "sha256": "$PREVIEW_SHA256",
            "buildTimestampUtc": "$BUILD_TIMESTAMP",
            "signing": "debug",
            "launchMode": "vnext-synthetic-reference"
          }
          EOF

          cat dist/SHA256SUMS.txt
          cat dist/BUILD_PROVENANCE.txt
          cat dist/BUILD_PROVENANCE.json

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDIG-Android-UI-vNext-Preview-${{ github.sha }}
          path: |
            dist/PDIG-Android-UI-vNext-Preview.apk
            dist/PDIG-Android-UI-vNext-ProductionDebug.apk
            dist/SHA256SUMS.txt
            dist/BUILD_PROVENANCE.txt
            dist/BUILD_PROVENANCE.json
            dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TAG="android-ui-vnext-preview-$SHORT_SHA"

          gh release create "$TAG" \
            "dist/PDIG-Android-UI-vNext-Preview.apk#PDIG Android UI vNext Preview APK" \
            "dist/PDIG-Android-UI-vNext-ProductionDebug.apk#PDIG Android UI vNext ProductionDebug APK" \
            "dist/SHA256SUMS.txt#SHA-256 checksums" \
            "dist/BUILD_PROVENANCE.txt#Build provenance" \
            "dist/BUILD_PROVENANCE.json#Machine-readable build provenance" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PDIG Android UI vNext Preview · $SHORT_SHA" \
            --notes-file dist/RELEASE_NOTES.md

          echo "releaseTag=$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,tagName,name,isPrerelease,assets
