name: Android emulator E2E (device instrumentation)

# 诚实边界（不要删）：
#   本 workflow 只为把 ANDROID_EMULATOR_E2E 从「仅本机 AVD」推向「CI 可复现」。
#   它真实启动 emulator、安装 debug APK 并跑 instrumented 测试；默认只跑一个**子集**
#   （设备内 SQLCipher / Keystore / 屏幕保护这三个不需要 UI 机器人的证据类）。
#   在 52 个 androidTest 类全部稳定之前，不得把结论写成「Android E2E 全量 PASS」。
#
# 为什么不是 macos-15（已实测）：
#   run 43630295255 的 emulator 日志是 `HVF error: HV_UNSUPPORTED` /
#   `failed to initialize HVF: Invalid argument` —— GitHub 托管的 macOS runner 不提供
#   嵌套虚拟化，arm64 系统镜像因此起不来（Timeout waiting for emulator to boot）。
#   所以这里走 GitHub 官方支持的 Linux 路径：ubuntu-latest + x86_64 镜像 + /dev/kvm。
#   开工前会先断言 /dev/kvm 存在，避免"其实是软件模拟"被误当成硬件加速证据。

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: "AVD API level"
        default: "34"
      test_classes:
        description: "逗号分隔的 instrumented 测试类（留空 = 全部）"
        default: "com.pdig.app.evidence.PersistenceEvidenceTest,com.pdig.app.evidence.RepositoryKeystoreEvidenceTest,com.pdig.app.evidence.ScreenProtectionEvidenceTest"
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-emulator-e2e.yml

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Instrumented tests (x86_64 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      API_LEVEL: ${{ github.event.inputs.api_level || '34' }}
      TEST_CLASSES: ${{ github.event.inputs.test_classes || 'com.pdig.app.evidence.PersistenceEvidenceTest,com.pdig.app.evidence.RepositoryKeystoreEvidenceTest,com.pdig.app.evidence.ScreenProtectionEvidenceTest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      # 硬件加速是这条 job 的全部意义所在：没有 KVM 就只是慢速软件模拟，
      # 那样的结论不能写成「CI 上真实运行过设备证据」。
      - name: Assert KVM availability
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          grep -c -E 'vmx|svm' /proc/cpuinfo

      - name: Enable KVM group perms
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # ubuntu-latest 镜像自带 SDK，但 cmdline-tools 不在 PATH
      # （run 43633280886：line 3: sdkmanager: command not found，exit 127）。
      - name: Locate Android SDK tooling
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "::error::cmdline-tools not found under $SDK_ROOT"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"
          echo "sdkmanager at $SDK_ROOT/cmdline-tools/latest/bin"

      - name: Configure Android SDK location
        working-directory: android
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Install SDK platform + x86_64 system image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" \
            "emulator" "system-images;android-${API_LEVEL};google_apis;x86_64" >/dev/null
          sdkmanager --list_installed | sed -n '1,30p'

      - name: Gradle wrapper permissions
        working-directory: android
        run: chmod +x ./gradlew

      # 先把两个 APK 编出来，避免把编译时间算进 emulator 会话里。
      - name: Build app + androidTest APKs
        working-directory: android
        # flavor 维度是 tier（production / preview），因此 androidTest 任务必须带 flavor：
        # run 43627021585 证明 `assembleDebugAndroidTest` 在 :app 上是 ambiguous。
        run: ./gradlew --no-daemon --console=plain :app:assembleProductionDebug :app:assembleProductionDebugAndroidTest

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot -no-window -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -euo pipefail
            cd android
            ARGS=""
            if [ -n "${TEST_CLASSES}" ]; then
              ARGS="-Pandroid.testInstrumentationRunnerArguments.class=${TEST_CLASSES}"
            fi
            echo "instrumented classes: ${TEST_CLASSES:-<all>}"
            ./gradlew --no-daemon --console=plain :app:connectedProductionDebugAndroidTest $ARGS

      - name: Summarise instrumented results
        if: always()
        run: |
          set +e
          echo "--- androidTest XML summary ---"
          for f in $(find android/app/build/outputs/androidTest-results -name "*.xml" 2>/dev/null); do
            echo "== $f"
            grep -o 'tests="[0-9]*"[^>]*failures="[0-9]*"' "$f" | head -3
          done
          echo "--- device info ---"
          adb shell getprop ro.build.version.sdk 2>/dev/null || true
          adb shell getprop ro.product.cpu.abi 2>/dev/null || true

      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-instrumented
          path: |
            android/app/build/outputs/androidTest-results/**
            android/app/build/reports/androidTests/**
          if-no-files-found: warn
          retention-days: 21
