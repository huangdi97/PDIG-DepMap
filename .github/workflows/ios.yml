name: iOS

# 触发方式同 ci.yml：显式列举分支 + PR + 手工 dispatch。
#
# ⚠ 截至 2026-09-19，本仓库的 push 触发从未真实产生过一次运行
# （见 GIT_OPS_INCIDENT_AND_RULES.md §5）。因此**不要**假设 push 已被守住：
# 远端验证一律手工 `gh workflow run iOS --ref <branch>` 并核对 head_sha。
on:
  push:
    branches:
      - main
      - feat/mvp03-living-graph
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# ---------------------------------------------------------------------------
# 诚实范围声明（不要删除）
# ---------------------------------------------------------------------------
# 本 workflow 只做"在 GitHub-hosted macOS runner 上真实可执行"的门禁：
#
#   job ios-core : swift build（PDIGCore + PDIGConformance + PDIGApp 可执行）
#                  + swift test（canonical 91+37=128 条 + 核心 smoke + PDIGApp 视图模型）
#                  + 截图 harness（PDIGApp --screenshot → macOS 渲染 PNG + evidence-index）
#
# 明确 NOT AVAILABLE / NOT_RUN（不 fake，不用 continue-on-error 假装通过）：
#
#   IOS_SIGNING / TESTFLIGHT / APP_STORE      = EXTERNAL_BLOCKED（需人类动作）
#   IOS_DEVICE_RUNTIME（真机 LocalAuthentication / Keychain 访问组）
#                                            = NOT_RUN
#   IOS_SQLCIPHER_PERSISTENCE                 = NOT_RUN（App 用系统 sqlite +
#                                                PDIGCore GraphSerialize；SQLCipher
#                                                at-rest 加密未接入）
#   IOS_VISUAL（截图）                        = MACOS_RENDER（macOS 上 SwiftUI
#                                                ImageRenderer 渲染，不是模拟器/
#                                                真机截图，无 XCUITest）
#   IOS_ARGON2ID_NATIVE                       = PASS（vendored Argon2 经转发头接入，
#                                               depmap-golden-v1 对 derivedKey 做字节级
#                                               golden 校验）
#
# 口径：本 workflow 的结论叫 IOS_CI_COMPILE_AND_HOST_CONFORMANCE，
# **不**等于「iOS 应用可上架」，也**不**替代真机门禁。
# ---------------------------------------------------------------------------

jobs:
  ios-core:
    name: iOS core (Swift build + canonical conformance + N4 app)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 记录工具链版本：跨 runner 镜像升级时，编译行为差异要有据可查。
      - name: Swift toolchain
        run: swift --version

      # ⚠ 不要写成 `swift build 2>&1 | tail -N`：管道的退出码取自 `tail`，
      # 编译失败会被吞成 0，产出一个"什么都没验证"的绿灯。
      - name: Build (PDIGCore + PDIGConformance + PDIGApp)
        working-directory: ios
        run: swift build

      # canonical runner 从仓库读冻结 fixture（不在包里内嵌副本），
      # 因此必须在仓库根下执行；SwiftPM 的 cwd 即为包目录，上溯两级到根。
      # 会顺带写出 conformance/reports/ios.json（N5 差分要用）。
      - name: Test (canonical 91+37 smoke + PDIGApp view models)
        working-directory: ios
        run: swift test

      # N4 App 单元测试（显式跑一遍，便于定位失败归属）。
      - name: Test (PDIGAppTests)
        working-directory: ios
        run: swift test --filter PDIGAppTests

      # 截图 harness：macOS 渲染关键屏 → artifacts/runtime-evidence/ios-n4-<runid>/
      - name: Generate screenshots (macOS SwiftUI render)
        working-directory: ios
        run: |
          RUNID=$(date +%Y%m%d%H%M%S)
          mkdir -p ../artifacts/runtime-evidence
          swift run PDIGApp --screenshot --runid "$RUNID" --output "../artifacts/runtime-evidence/ios-n4-$RUNID"
          ls -la "../artifacts/runtime-evidence/ios-n4-$RUNID"

      - name: Upload iOS conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-conformance-report
          path: conformance/reports/ios.json
          if-no-files-found: error

      - name: Upload iOS N4 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-n4-screenshots
          path: artifacts/runtime-evidence/ios-n4-*/
          if-no-files-found: warn