name: Android UI vNext Post-Freeze Production Evidence

# Targeted current-head evidence for visible Production changes after the last
# user-approved Android Reference Freeze. This workflow never self-approves
# Human Visual Acceptance, never changes release routing, and uses only an
# instrumentation-seeded isolated encrypted Reality through AppContainer.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/android-ui-vnext-translation
    paths:
      - '.github/workflows/android-ui-vnext-postfreeze-production-evidence.yml'
      - 'android/scripts/postfreeze_closure_capture.py'
      - 'android/app/src/androidTest/kotlin/com/pdig/uivnext/evidence/PostFreezeEvidenceSeedTest.kt'
      - 'android/app/src/main/kotlin/com/pdig/uivnext/ui/ProductionChangePlanScreen.kt'
      - 'android/app/src/main/kotlin/com/pdig/uivnext/ui/ProductionInventoryScreens.kt'
      - 'android/app/src/main/kotlin/com/pdig/uivnext/ui/ProductionRecordTrace.kt'
      - 'android/app/src/main/kotlin/com/pdig/uivnext/production/**'
      - 'android/app/src/main/kotlin/com/pdig/app/**'
      - 'android/core/**'
      - 'android/repos/**'
      - 'android/app/build.gradle.kts'

permissions:
  contents: read

concurrency:
  group: android-vnext-postfreeze-production-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phone-production-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enable host KVM
        run: |
          sudo chown "$USER" /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Validate capture harness syntax
        run: python3 -m py_compile android/scripts/postfreeze_closure_capture.py

      - name: Build exact two-key Production VNext + instrumentation APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :app:clean \
            :app:assembleProductionDebug \
            :app:assembleProductionDebugAndroidTest \
            --no-daemon --stacktrace \
            -PpdigProductionUiGeneration=vnext \
            -PpdigProductionVNextCutoverApproved=true

          CONFIG=app/build/generated/source/buildConfig/production/debug/com/pdig/app/BuildConfig.java
          test -f "$CONFIG"
          grep -F 'PRODUCTION_UI_GENERATION = "vnext";' "$CONFIG" >/dev/null
          grep -F 'PRODUCTION_VNEXT_CUTOVER_APPROVED = true;' "$CONFIG" >/dev/null

          APK=app/build/outputs/apk/production/debug/app-production-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*production*debug*androidTest*.apk' -print -quit)
          test -f "$APK"
          test -n "$TEST_APK"
          test -f "$TEST_APK"
          sha256sum "$APK"
          sha256sum "$TEST_APK"

      - name: Capture targeted post-freeze Production evidence on API36
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          target: google_apis
          ram-size: 3072M
          heap-size: 512M
          disk-size: 8G
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect
          pre-emulator-launch-script: |
            mkdir -p "$HOME/.android"
            printf 'Vulkan = off\nGLDirectMem = on\n' > "$HOME/.android/advancedFeatures.ini"
          disable-animations: true
          script: |
            set -euo pipefail
            ROOT="$PWD"
            APK="$ROOT/android/app/build/outputs/apk/production/debug/app-production-debug.apk"
            TEST_APK=$(find "$ROOT/android/app/build/outputs/apk/androidTest" -name '*production*debug*androidTest*.apk' -print -quit)
            OUT="$ROOT/artifacts/runtime-evidence/postfreeze-production-${GITHUB_SHA}"
            mkdir -p "$OUT/seed-logs"

            adb uninstall com.pdig.app >/dev/null 2>&1 || true
            adb install "$APK"
            adb install "$TEST_APK"

            INSTRUMENTATION=$(adb shell pm list instrumentation | tr -d '\r' | awk '/target=com.pdig.app/ {sub(/^instrumentation:/,"",$1); print $1; exit}')
            if [ -z "$INSTRUMENTATION" ]; then
              echo 'No instrumentation runner targeting com.pdig.app'; exit 1
            fi
            echo "instrumentation=$INSTRUMENTATION"

            run_seed() {
              local method="$1"
              local log="$OUT/seed-logs/${method}.txt"
              adb shell am force-stop com.pdig.app || true
              adb shell am instrument -w \
                -e class "com.pdig.uivnext.evidence.PostFreezeEvidenceSeedTest#${method}" \
                "$INSTRUMENTATION" | tee "$log"
              grep -q 'OK (1 test)' "$log" || {
                echo "Seed instrumentation did not report OK (1 test): $method"; exit 1;
              }
            }

            export PDIG_SOURCE_HEAD="$GITHUB_SHA"
            export PDIG_ANDROID_TREE_HEAD="$(git log -1 --format=%h -- android/)"
            export PDIG_PACKAGE=com.pdig.app
            export PDIG_APK_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
            export PDIG_DATA_MODE=isolated-postfreeze-evidence-reality

            run_seed seedPhoneMakeBeforeBreakJourney
            python3 android/scripts/postfreeze_closure_capture.py \
              --mode prod-journey \
              --out "$OUT" \
              --label phone

            run_seed seedStalePhoneChange
            python3 android/scripts/postfreeze_closure_capture.py \
              --mode prod-stale \
              --out "$OUT" \
              --label stale-reanalysis

            python3 - <<'PY'
            import json
            import os
            from pathlib import Path

            root = Path('artifacts/runtime-evidence') / f"postfreeze-production-{os.environ['GITHUB_SHA']}"
            manifest = root / 'MANIFEST.json'
            entries = json.loads(manifest.read_text(encoding='utf-8'))
            by_id = {entry['shot_id']: entry for entry in entries}
            expected = {
                'production-account-detail-change-boundary',
                'production-email-detail-change-boundary',
                'production-service-detail-change-boundary',
                'production-records',
                'production-change-stale',
                'production-change-reanalyzed',
            }
            missing = sorted(expected - set(by_id))
            if missing:
                raise SystemExit(f'missing expected post-freeze evidence entries: {missing}')

            head = os.environ['GITHUB_SHA']
            for shot_id in sorted(expected):
                entry = by_id[shot_id]
                if entry.get('sourceHead') != head:
                    raise SystemExit(f'{shot_id}: sourceHead mismatch {entry.get("sourceHead")} != {head}')
                if entry.get('apkSha256') != os.environ['PDIG_APK_SHA256']:
                    raise SystemExit(f'{shot_id}: APK hash mismatch')
                if entry.get('humanReview') != 'NOT_RUN':
                    raise SystemExit(f'{shot_id}: evidence harness must not self-approve human review')
                if entry.get('assertionsMissing'):
                    raise SystemExit(f'{shot_id}: missing assertions {entry["assertionsMissing"]}')

            records = by_id['production-records']
            if records.get('secureWindowExpected') is not True:
                raise SystemExit('Production Records evidence must retain FLAG_SECURE expectation')

            print(f'POSTFREEZE_EVIDENCE_MANIFEST=PASS entries={len(entries)}')
            print(f'POSTFREEZE_EVIDENCE_HEAD={head}')
            print(f'POSTFREEZE_EVIDENCE_APK_SHA256={os.environ["PDIG_APK_SHA256"]}')
            PY

      - name: Upload targeted Production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-postfreeze-production-evidence-${{ github.sha }}
          path: artifacts/runtime-evidence/postfreeze-production-${{ github.sha }}/
          if-no-files-found: warn
          retention-days: 21
